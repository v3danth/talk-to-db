<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · MIS Lookup</title>
<style>
:root { --bg: #f6f7f9; --surface: #fff; --text: #16191d; --muted: #5d6570; --border: #cfd4db; --accent: #2557d6; --accent-hover: #1d47b3;
  --on-accent: #fff; --danger: #b42318; --danger-soft: #fdecea; --focus: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111317; --surface: #191c21; --text: #e8eaed; --muted: #a3abb5; --border: #3b414a;
  --accent: #7aa2ff; --accent-hover: #9bb9ff; --on-accent: #0b1020; --danger: #ff8a80; --danger-soft: #3a1f1d; } }
:root[data-theme="dark"] { --bg: #111317; --surface: #191c21; --text: #e8eaed; --muted: #a3abb5; --border: #3b414a;
  --accent: #7aa2ff; --accent-hover: #9bb9ff; --on-accent: #0b1020; --danger: #ff8a80; --danger-soft: #3a1f1d; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding: 16px; }
main { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px 24px; }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
p { margin: 0 0 24px; color: var(--muted); }
label { display: block; font-weight: 500; margin: 16px 0 6px; }
input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
input:focus-visible, button:focus-visible { outline: none; box-shadow: var(--focus); }
button { width: 100%; height: 44px; margin-top: 24px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; cursor: pointer; }
button:hover { background: var(--accent-hover); } button:disabled { opacity: .6; cursor: not-allowed; }
.error { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); border: 1px solid currentColor; }
.foot { margin-top: 24px; font-size: 12px; color: var(--muted); }
</style>
<script>try { const t = localStorage.getItem("mis.theme"); if (t && t !== '"system"') document.documentElement.dataset.theme = JSON.parse(t); } catch {}</script>
</head>
<body>
<main>
  <h1>Sign in to MIS Lookup</h1>
  <p>For the RPE and DB admin teams. Every search and profile you open is logged under your name.</p>
  <form id="f" novalidate>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="error" id="err" role="alert" hidden></div>
    <button id="go" type="submit">Sign in</button>
  </form>
  <div class="foot">No account? Ask whoever runs this server to add you with <code>manage_users.py add</code>.</div>
</main>
<script>
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.onsubmit = async e => {
  e.preventDefault();
  const username = f.username.value.trim(), password = f.password.value;
  if (!username || !password) { show("Enter your username and password."); return; }
  go.disabled = true; go.textContent = "Signing in…"; err.hidden = true;
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({username, password})});
    if (r.ok) {
      let next = new URLSearchParams(location.search).get("next") || "/";
      if (!next.startsWith("/") || next.startsWith("//")) next = "/";   // only same-site paths
      // The #q= / #p= part never reaches the server; the browser kept it on this page's URL, so carry it on.
      location.href = next.split("#")[0] + location.hash;
      return;
    }
    const d = await r.json().catch(() => ({}));
    show(d.detail || "Sign-in failed. Try again.");
    f.password.value = ""; f.password.focus();
  } catch { show("Can't reach the server. Check it's running, then try again."); }
  go.disabled = false; go.textContent = "Sign in";
};
function show(m) { err.textContent = m; err.hidden = false; }
</script>
</body>
</html>
